<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
        color: #d1a050;
      }
      ul.list {
        width: 100%;
        max-width: 1210px;
        margin: 50px auto;
        padding: 150px 25px;
      }
      ul.list li {
        border-bottom: 1px solid #d1a050;
      }
      ul.list .title {
        height: 36px;
        padding: 15px 20px;
        display: flex;
        justify-content: flex-start;
        align-items: center;
        cursor: pointer;
      }
      ul.list .title h2 {
        font-size: 24px;
        font-weight: 400;
      }
      ul.list .title h2.on {
        font-weight: 600;
      }
      ul.list .title span {
        position: relative;
        width: 24px;
        display: block;
      }
      ul.list .title span::before,
      ul.list .title span::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 50%;
        background: #d1a050;
        border-radius: 2px;
        transition: 0.2s linear;
      }
      ul.list .title span::before {
        width: 10px;
        height: 2px;
        margin: -0px 0 0 -4px;
      }
      ul.list .title span::after {
        width: 2px;
        height: 10px;
        margin: -4px 0 0 0;
      }
      ul.list .title span.on::after,
      ul.list .title span.on::before {
        transform: rotate(45deg);
      }
      ul.list .contents {
      }
      ul.list .contents p {
        height: 0;
        overflow: hidden;
        transform: translateY(-20px);
        transition: 0.5s;
        opacity: 0;
      }
      ul.list .contents p.on {
        height: auto;
        opacity: 1;
        transform: translateY(10px);
      }
      ul.list .contents p img {
        width: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <ul class="list">
      <li><h1>Slices - Oat Base</h1></li>
      <li>
        <div class="title">
          <span></span>
          <h2>AMERICAN</h2>
        </div>
        <div class="contents">
          <p>
            <img
              src="https://d29wx3mrk1ysd0.cloudfront.net/_img/sub231114/SLICES-OATBASE-AMERICAN-pc.jpg"
              alt=""
            />
          </p>
        </div>
      </li>
      <li>
        <div class="title">
          <span></span>
          <h2>CHEDDAR</h2>
        </div>
        <div class="contents">
          <p>
            <img
              src="https://d29wx3mrk1ysd0.cloudfront.net/_img/sub231114/SLICES-OATBASE-CHEDDAR-pc.jpg"
              alt=""
            />
          </p>
        </div>
      </li>
      <li>
        <div class="title">
          <span></span>
          <h2>PEPPER JACK</h2>
          <p></p>
        </div>
        <div class="contents">
          <p>
            <img
              src="https://d29wx3mrk1ysd0.cloudfront.net/_img/sub231114/SLICES-OATBASE-PEPPERJACK-pc.jpg"
              alt=""
            />
          </p>
        </div>
      </li>
    </ul>
    <script>
      function myfnc() {
        let bool = this.querySelector("span").classList.contains("on");
        item.forEach(function (v, k) {
          // v.querySelector("span").classList.remove("on");
          // v.querySelector(".contents p").classList.remove("on");
          // v.querySelector(".contents p").style.height = 0;
        });
        if (!bool) {
          this.querySelector("span").classList.add("on");
          this.querySelector(".contents p").classList.add("on");
          let ht = this.querySelector(".contents p img").clientHeight;
          console.log(ht);
          this.querySelector(".contents p").style.height = ht + "px";
        }
      }

      let item = document.querySelectorAll(".list li");
      item.forEach(function (v, k) {
        v.onclick = myfnc;
      });
    </script>
  </body>
</html>
