<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      video {
        width: 100%;
        height: 100vh;
        object-fit: cover;
      }
      body {
        width: 100%;
        max-width: 1920px;
      }
      div.nav {
        width: 100%;
        display: flex;
        position: absolute;
        top: 0;
        left: 0;
        padding: 0 80px;
        height: 108px;
        text-align: center;
        align-items: center;
        justify-content: space-between;
        box-sizing: border-box;
      }
      div.nav ul {
        list-style: none;
        align-items: center;
        justify-content: center;
        display: flex;
        color: #fff;
      }
      div.nav .logo {
        object-fit: cover;
      }
      div.nav .menu {
        display: flex;
        color: #fff;
      }
      div.nav ul li {
        padding: 0 38px;
      }
      div.con1,
      div.con2 {
        height: 100vh;
      }

      div.con1 .txt,
      div.con2 .txt {
        padding: 80px;
      }
    </style>
  </head>
  <body>
    <div class="nav">
      <div class="logo">
        <img
          src="	https://www.taekwanggroup.co.kr/resources/front/assets/img/ex/header-d0329d3d/header_logo_white.svg"
          alt=""
        />
      </div>
      <ul>
        <li>태광그룹</li>
        <li>사업분야</li>
        <li>지속가능경영</li>
        <li>홍보센터</li>
        <li>인재채용</li>
      </ul>
      <div class="menu">
        <p>Business Groups</p>
        <span>kr</span>
      </div>
    </div>

    <div class="con1">
      <div class="txt">
        <p>연결(Connection) 미래(Future) 빛(Light)</p>
        <p>
          Connection The<br />
          Future With Light
        </p>
      </div>

      <video
        src="https://www.taekwanggroup.co.kr/UPLOAD/MAIN_MOVIE/FILE20250310181255pypNd.mp4"
      ></video>
    </div>
    <div class="con2">
      <video
        src="https://www.taekwanggroup.co.kr//UPLOAD/MAIN_MOVIE/main_visual_2.mp4"
      ></video>
    </div>
    <script></script>
  </body>
</html>
